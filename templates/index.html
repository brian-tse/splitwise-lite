{% extends 'base.html' %}

{% block content %}
<h3 class="mb-3">Your Groups</h3>
<div class="row row-cols-1 row-cols-md-2 g-3 mb-4">
  {% for group in groups %}
  <div class="col">
    <div class="card h-100 shadow-sm">
      <div class="card-body d-flex justify-content-between align-items-center">
        <a href="/group/{{ group[0] }}" class="text-decoration-none">{{ group[1] }}</a>
        <span class="badge bg-secondary">/group/{{ group[0] }}</span>
      </div>
    </div>
  </div>
  {% endfor %}
</div>

<h4 class="mb-3">Create New Group</h4>
<form method="POST" action="/add_group" class="mb-5">
  <div class="mb-2">
    <input type="text" class="form-control" name="group_name" placeholder="Group name" required>
  </div>
  <div class="mb-2">
    <input type="text" class="form-control" name="members" placeholder="Members (comma-separated)" required>
  </div>
  <button class="btn btn-primary">Create Group</button>
</form>
{% endblock %}
